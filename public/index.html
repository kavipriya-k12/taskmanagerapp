<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Task Management - Login</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>

<body class="auth-page">

    <div class="auth-wrapper">

        <div class="brand">

            <div class="brand-icon">
                ✓
            </div>

            <div>
                <h1>TaskFlow</h1>

                <p>
                    TASK MANAGEMENT
                </p>
            </div>

        </div>


        <div class="auth-card">

            <div class="auth-heading">

                <h2>
                    Welcome Back
                </h2>

                <p>
                    Login to manage your tasks
                </p>

            </div>


            <form id="loginForm">

                <div class="input-box">

                    <label>
                        Email Address
                    </label>

                    <input
                        type="email"
                        id="loginEmail"
                        placeholder="Enter your email"
                        required
                    >

                </div>


                <div class="input-box">

                    <label>
                        Password
                    </label>

                    <input
                        type="password"
                        id="loginPassword"
                        placeholder="Enter your password"
                        required
                    >

                </div>


                <button
                    type="submit"
                    class="main-btn"
                >
                    Login
                </button>


                <p
                    id="loginMessage"
                    class="message"
                ></p>

            </form>


            <div class="auth-footer">

                Don't have an account?

                <a href="register.html">
                    Create Account
                </a>

            </div>

        </div>


        <p class="copyright">
            TaskFlow • Full Stack Task Management
        </p>

    </div>


    <script src="script.js"></script>

</body>

</html>
