<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Create Account - TaskFlow</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>

<body class="auth-page">

    <div class="auth-wrapper">

        <div class="brand">

            <div class="brand-icon">
                ✓
            </div>

            <div>

                <h1>
                    TaskFlow
                </h1>

                <p>
                    TASK MANAGEMENT
                </p>

            </div>

        </div>


        <div class="auth-card">

            <div class="auth-heading">

                <h2>
                    Create Account
                </h2>

                <p>
                    Start managing your tasks today
                </p>

            </div>


            <form id="registerForm">

                <div class="input-box">

                    <label>
                        Full Name
                    </label>

                    <input
                        type="text"
                        id="registerName"
                        placeholder="Enter your full name"
                        required
                    >

                </div>


                <div class="input-box">

                    <label>
                        Email Address
                    </label>

                    <input
                        type="email"
                        id="registerEmail"
                        placeholder="Enter your email"
                        required
                    >

                </div>


                <div class="input-box">

                    <label>
                        Password
                    </label>

                    <input
                        type="password"
                        id="registerPassword"
                        placeholder="Minimum 6 characters"
                        minlength="6"
                        required
                    >

                </div>


                <button
                    type="submit"
                    class="main-btn"
                >
                    Create Account
                </button>


                <p
                    id="registerMessage"
                    class="message"
                ></p>

            </form>


            <div class="auth-footer">

                Already have an account?

                <a href="index.html">
                    Login
                </a>

            </div>

        </div>


        <p class="copyright">
            TaskFlow • Full Stack Task Management
        </p>

    </div>


    <script src="script.js"></script>

</body>

</html>
